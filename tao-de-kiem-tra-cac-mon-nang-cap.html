<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiết kế đề kiểm tra theo CV 7991</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#0b0e14; --panel:#11151d; --panel2:#161b26; --line:#232938;
    --text:#e7eaf0; --muted:#8b93a7; --accent:#3aa6ff; --accent2:#ffb454;
    --good:#3ddc97; --bad:#ff6b6b;
    --serif:"Source Serif 4","Georgia",serif; --sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  header h1{font-family:var(--serif);font-size:1.25rem;margin:0;font-weight:600;letter-spacing:.2px;}
  header .sub{color:var(--muted);font-size:.78rem;margin-top:2px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-size:.82rem;cursor:pointer;font-family:var(--sans);}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:#06131f;border-color:var(--accent);font-weight:600;}
  button.danger{color:var(--bad);}
  button.small{padding:4px 8px;font-size:.74rem;}
  nav{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto;}
  nav button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:11px 14px;color:var(--muted);white-space:nowrap;}
  nav button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600;}
  main{padding:20px 22px 80px;max-width:1180px;margin:0 auto;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .card h2{font-family:var(--serif);font-size:1rem;margin:0 0 12px;color:var(--accent2);}
  label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:4px;}
  input[type=text],input[type=number],textarea,select{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text);
    padding:7px 9px;font-size:.85rem;font-family:var(--sans);
  }
  textarea{resize:vertical;min-height:46px;}
  .grid{display:grid;gap:10px;}
  .grid.cols2{grid-template-columns:1fr 1fr;}
  .grid.cols3{grid-template-columns:1fr 1fr 1fr;}
  .grid.cols4{grid-template-columns:1fr 1fr 1fr 1fr;}
  table{width:100%;border-collapse:collapse;font-size:.8rem;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle;}
  th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.3px;}
  td.left{text-align:left;}
  .topic-block{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--panel2);}
  .topic-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .topic-head input{flex:1;font-weight:600;}
  .level-row{display:grid;grid-template-columns:70px 1fr;gap:8px;margin-bottom:8px;align-items:start;}
  .level-tag{padding:6px 0;font-size:.74rem;font-weight:700;border-radius:6px;text-align:center;align-self:start;}
  .tag-NB{background:#1c3a2c;color:var(--good);}
  .tag-TH{background:#2c3a1c;color:var(--accent2);}
  .tag-VD{background:#2c1c3a;color:#c98bff;}
  .alloc-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .alloc-cell{display:flex;flex-direction:column;gap:2px;width:96px;}
  .alloc-cell span{font-size:.65rem;color:var(--muted);}
  .alloc-cell input{padding:5px;text-align:center;}
  .alloc-cell input:disabled{opacity:.25;cursor:not-allowed;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:700;}
  .pill.ok{background:#13301f;color:var(--good);}
  .pill.bad{background:#3a1414;color:var(--bad);}
  .muted{color:var(--muted);}
  .right{text-align:right;}
  .flex{display:flex;gap:8px;align-items:center;}
  .between{justify-content:space-between;}
  .qslot{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--panel2);}
  .qslot .meta{font-size:.7rem;color:var(--muted);margin-bottom:6px;}
  .ans-line{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-top:4px;}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:8px;font-size:.82rem;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.4);}
  @media print{
    body{background:#fff;color:#000;}
    header,nav,.toolbar,.no-print,button{display:none !important;}
    .card{border-color:#999;background:#fff;}
    th{background:#eee;color:#000;}
    .pill{display:none;}
  }
  @media (max-width:720px){
    .grid.cols2,.grid.cols3,.grid.cols4{grid-template-columns:1fr;}
    .level-row{grid-template-columns:1fr;}
  }
  #authScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;}
  #authBox{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;text-align:center;}
  #authBox h2{font-family:var(--serif);font-size:1.1rem;margin:0 0 4px;color:var(--text);}
  #authBox p.sub{color:var(--muted);font-size:.78rem;margin:0 0 18px;}
  #authBox input{margin-bottom:10px;}
  #authBox button.primary{width:100%;padding:9px;margin-top:4px;}
  #authMsg{font-size:.78rem;margin-top:12px;min-height:16px;}
  #authMsg.err{color:var(--bad);}
  #authMsg.ok{color:var(--good);}
  #authMsg.warn{color:var(--accent2);}
  #logoutBtn{margin-left:4px;}
</style>
</head>
<body>

<div id="authScreen">
  <div id="authBox">
    <h2>Thiết kế đề kiểm tra</h2>
    <p class="sub">Đăng nhập để sử dụng</p>
    <input type="text" id="authEmail" placeholder="Email đăng nhập" autocomplete="username">
    <input type="password" id="authPass" placeholder="Mật khẩu" autocomplete="current-password">
    <button class="primary" id="authBtn" onclick="doLogin()">Đăng nhập</button>
    <div id="authMsg"></div>
  </div>
</div>

<div id="appContainer" style="display:none">
<header>
  <div>
    <h1 id="examTitleHead">Thiết kế đề kiểm tra</h1>
    <div class="sub">Ma trận – Bản đặc tả – Đề – Đáp án theo Công văn 7991/BGDĐT-GDTrH · áp dụng mọi môn</div>
  </div>
  <div class="toolbar no-print">
    <button onclick="newExam()">+ Đề mới</button>
    <button onclick="openLoadDialog()">Mở đề đã lưu</button>
    <button class="primary" onclick="saveExam()">Lưu đề</button>
    <button onclick="exportBackupJson()">⬇️ Xuất file sao lưu</button>
    <button onclick="document.getElementById('import-json-input').click()">⬆️ Nhập file sao lưu</button>
    <input type="file" id="import-json-input" accept=".json" style="display:none" onchange="importBackupJson(event)">
    <button class="primary" onclick="exportAllWord()">📄 Xuất Word (Toàn bộ)</button>
    <button onclick="window.print()">In / Xuất PDF</button>
    <span id="quotaBadge" style="display:none;align-self:center;padding:4px 10px;border:1px solid #888;border-radius:14px;font-size:.8rem;white-space:nowrap"></span>
    <button id="logoutBtn" onclick="doLogout()">Đăng xuất</button>
  </div>
</header>

<nav id="tabBar"></nav>
<main id="mainArea"></main>
</div>

<script>
/* ---------------- FIREBASE AUTH + LICENSE CHECK ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBmn54Z8ZZ2lGDQexVWyJiLD4K2h7jf6Iw",
  authDomain: "de-kiem-tra-9aba7.firebaseapp.com",
  databaseURL: "https://de-kiem-tra-9aba7-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "de-kiem-tra-9aba7",
  storageBucket: "de-kiem-tra-9aba7.firebasestorage.app",
  messagingSenderId: "1816067741",
  appId: "1:1816067741:web:945d940ac4fe89d1cc9e74"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();
const fbFn = firebase.app().functions('asia-southeast1');
let licenseGoi = 'coban', luotConLai = 0, luotTong = 0, luotHomNay = 0, tranNgay = 40, warned80 = false;
function vnToday(){ return new Date(Date.now() + serverOffset + 7*3600*1000).toISOString().slice(0,10); }
function applyQuota(d){
  licenseGoi = d.goi || 'coban';
  luotConLai = Number(d.luotConLai) || 0;
  luotTong = Number(d.luotTong) || 0;
  tranNgay = Number(d.tranNgay) || 40;
  luotHomNay = (d.ngayDem === vnToday()) ? (Number(d.luotHomNay) || 0) : 0;
  renderQuotaBadge();
  if(licenseGoi === 'ai' && luotTong > 0){
    if(luotConLai > luotTong*0.2) warned80 = false;
    else if(!warned80 && luotConLai >= 0.5){
      warned80 = true;
      toast('⚠ Thầy đã dùng hơn 80% lượt AI (còn ' + Math.floor(luotConLai) + ' lượt). Hết lượt vẫn dùng được bằng key Gemini riêng ở Tab 1.');
    }
  }
}
function renderQuotaBadge(){
  const el = document.getElementById('quotaBadge');
  if(!el) return;
  if(licenseGoi !== 'ai'){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = '🤖 Còn ' + Math.floor(luotConLai) + ' lượt AI · hôm nay ' + Math.floor(luotHomNay) + '/' + tranNgay;
}
function useServerAI(){ return licenseGoi === 'ai' && luotConLai >= 0.5; }
let appRendered = false;
let licenseUnsub = null;
let mySessionId = null;
let kicked = false;
let serverOffset = 0;      // chênh lệch giờ máy chủ - giờ máy khách
let licenseExpiry = null;  // ngày hết hạn đang lưu (Date)
let licenseActive = true;
let licenseTimer = null;
function nowSrv(){ return Date.now() + serverOffset; }
function parseHetHan(v){
  if(!v) return null;
  if(typeof v === 'string') return new Date(v);
  if(typeof v.toDate === 'function') return v.toDate();
  if(v.seconds) return new Date(v.seconds * 1000);
  return null;
}
function enforceLicense(){
  const bad = !licenseActive || !licenseExpiry || isNaN(licenseExpiry.getTime()) || licenseExpiry.getTime() < nowSrv();
  if(bad){
    if(licenseUnsub){ licenseUnsub(); licenseUnsub = null; }
    if(licenseTimer){ clearInterval(licenseTimer); licenseTimer = null; }
    kicked = true;
    const ngayStr = licenseExpiry && !isNaN(licenseExpiry.getTime()) ? licenseExpiry.toLocaleDateString('vi-VN') : '';
    fbAuth.signOut().then(()=>{
      setAuthMsg('Tài khoản đã hết hạn sử dụng' + (ngayStr?` (${ngayStr})`:'') + '. Vui lòng liên hệ để gia hạn.', 'err');
    });
    return false;
  }
  return true;
}

function setAuthMsg(text, cls){
  const el = document.getElementById('authMsg');
  el.textContent = text || '';
  el.className = cls || '';
}

function getDeviceSessionId(uid){
  const key = 'devSession_' + uid;
  let v = localStorage.getItem(key);
  if(!v){
    v = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(36).slice(2)));
    localStorage.setItem(key, v);
  }
  return v;
}

function doLogin(){
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  if(!email || !pass){ setAuthMsg('Vui lòng nhập đầy đủ email và mật khẩu.', 'err'); return; }
  document.getElementById('authBtn').disabled = true;
  kicked = false;
  setAuthMsg('Đang đăng nhập...', '');
  fbAuth.signInWithEmailAndPassword(email, pass)
    .catch(err=>{
      document.getElementById('authBtn').disabled = false;
      let msg = 'Đăng nhập thất bại.';
      if(err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'){
        msg = 'Sai email hoặc mật khẩu.';
      } else if(err.code === 'auth/too-many-requests'){
        msg = 'Bạn thử sai quá nhiều lần, vui lòng đợi rồi thử lại.';
      }
      setAuthMsg(msg, 'err');
    });
}

function doLogout(){
  warned80 = false; licenseGoi = 'coban'; renderQuotaBadge();
  if(licenseUnsub){ licenseUnsub(); licenseUnsub = null; }
  if(licenseTimer){ clearInterval(licenseTimer); licenseTimer = null; }
  fbAuth.signOut();
}

async function checkLicenseAndEnter(user){
  setAuthMsg('Đang kiểm tra tài khoản...', '');
  try{
    const ref = fbDb.collection('licenses').doc(user.uid);
    const doc = await ref.get();
    if(!doc.exists){
      setAuthMsg('Tài khoản chưa được cấp quyền sử dụng. Liên hệ người bán để được hỗ trợ.', 'err');
      fbAuth.signOut();
      return;
    }
    const data = doc.data();
    let hetHan = null;
    if(data.ngayHetHan){
      if(typeof data.ngayHetHan === 'string'){
        hetHan = new Date(data.ngayHetHan);
      } else if(typeof data.ngayHetHan.toDate === 'function'){
        hetHan = data.ngayHetHan.toDate();
      } else if(data.ngayHetHan.seconds){
        hetHan = new Date(data.ngayHetHan.seconds * 1000);
      }
    }
    const active = data.active !== false;
    if(!active || !hetHan || isNaN(hetHan.getTime()) || hetHan.getTime() < Date.now()){
      const ngayStr = hetHan && !isNaN(hetHan.getTime()) ? hetHan.toLocaleDateString('vi-VN') : '';
      setAuthMsg('Tài khoản đã hết hạn sử dụng' + (ngayStr?` (${ngayStr})`:'') + '. Vui lòng liên hệ để gia hạn.', 'err');
      fbAuth.signOut();
      return;
    }
    // Hợp lệ -> đăng ký thiết bị này là thiết bị đang hoạt động
    mySessionId = getDeviceSessionId(user.uid);
    await ref.update({
      activeSession: mySessionId,
      activeSessionAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // Lấy giờ máy chủ để chống chỉnh đồng hồ máy khách
    try{
      const sv = await ref.get({source:'server'});
      const st = sv.data().activeSessionAt;
      if(st && st.toDate){ serverOffset = st.toDate().getTime() - Date.now(); }
    }catch(_){}
    licenseExpiry = hetHan; licenseActive = active;
    if(!enforceLicense()) return;
    try{ const cur = await ref.get(); applyQuota(cur.data()); }catch(_){ applyQuota(data); }
    if(licenseTimer){ clearInterval(licenseTimer); }
    licenseTimer = setInterval(enforceLicense, 60000);
    if(licenseUnsub){ licenseUnsub(); }
    licenseUnsub = ref.onSnapshot(snap=>{
      const d = snap.data();
      if(!d) return;
      licenseExpiry = parseHetHan(d.ngayHetHan);
      licenseActive = d.active !== false;
      if(!enforceLicense()) return;
      applyQuota(d);
      if(d.activeSession && d.activeSession !== mySessionId){
        kicked = true;
        if(licenseUnsub){ licenseUnsub(); licenseUnsub = null; }
        fbAuth.signOut().then(()=>{
          setAuthMsg('Tài khoản này vừa được đăng nhập ở một thiết bị khác nên bạn đã bị đăng xuất.', 'warn');
        });
      }
    });
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appContainer').style.display = '';
    if(!appRendered){ appRendered = true; render(); }
  }catch(e){
    setAuthMsg('Không kiểm tra được tài khoản. Kiểm tra kết nối mạng và thử lại.', 'err');
    fbAuth.signOut();
  }
}

fbAuth.onAuthStateChanged(user=>{
  document.getElementById('authBtn').disabled = false;
  if(user){
    checkLicenseAndEnter(user);
  }else{
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appContainer').style.display = 'none';
    if(!kicked) setAuthMsg('', '');
    kicked = false;
  }
});

const LEVELS = ["NB","TH","VD"];

};

  dung_sai:{label:"Đúng – Sai", group:"TNKQ", kind:"dung_sai"},

const AI_RULE_LABELS = {

  chinh_xac:"- Chỉ dùng kiến thức, thuật ngữ, kí hiệu, công thức, phương trình, số liệu đúng như sách giáo khoa đang dạy. Nếu có phần NỘI DUNG SÁCH GIÁO KHOA thì chỉ lấy từ đó, không thêm kiến thức ngoài.\n- Không dùng khái niệm, thuật ngữ của lớp cao hơn hoặc của bài chưa học; không dùng từ trong danh sách CẤM.\n- Không bịa số liệu, mốc, tỉ lệ. Số liệu phải có trong sách giáo khoa hoặc là bài toán tự đặt tính ra được. Không chắc thì không hỏi, và trả về ===CANHOI===.\n- Chỉ MỘT đáp án đúng, không gây tranh cãi. Không hỏi kiểu có nhiều đáp án như \"dưới bao nhiêu\", \"ít nhất bao nhiêu\", \"tối đa bao nhiêu\" khi sách không nêu một giá trị cố định.\n- Hạn chế câu chỉ đếm danh sách (\"có bao nhiêu yếu tố/đơn vị...\"); hỏi nội dung có ý nghĩa thay vì đếm.\n- Mức Biết: nhớ lại đúng khái niệm, nội dung trong sách. Mức Hiểu: giải thích, so sánh, phân biệt, không chỉ nhớ. Mức Vận dụng: tình huống thực tế mới hoặc bài tính cần kiến thức của môn, không phải phép toán thuần túy (tỉ lệ, cộng trừ) không có kiến thức môn học.\n- Phương án nhiễu hợp lý, cùng loại và cùng độ dài với đáp án đúng, liên quan đến bài; không dùng phương án phi lý (như \"kĩ năng ca hát\"). Đáp án đúng không được dài hay chi tiết hơn rõ rệt.\n- Phương trình, sơ đồ, quy trình, thí nghiệm phải đúng chiều và đúng thứ tự như sách giáo khoa; không tự thêm chiều phản ứng hay bước khác sách.\n- Câu dựa vào hình: mô tả hình phải khớp với đáp án, đồ thị và sơ đồ phải ghi đơn vị, không có chú thích thừa hay chú thích làm lộ hoặc làm sai đáp án.\n- Chỉ ra câu thuộc phần kiến thức nào của bài trong phần giải thích.",
  nhieu_lua_chon:"- Đúng 4 phương án A, B, C, D, mỗi phương án một dòng, khoảng 12 từ trở xuống, cùng cấu trúc.\n- Các phương án không trùng nhau; chỉ một đáp án đúng.\n- Không dùng \"Tất cả đều đúng/sai\", \"Cả A và B\".",
  dung_sai:"- Một tình huống dẫn chung (khoảng 40 từ trở xuống), sau đó 4 ý a), b), c), d); mỗi ý một khẳng định ngắn (khoảng 20 từ trở xuống), kiểm chứng được.\n- Số ý đúng/sai tuỳ nội dung, không theo khuôn cố định; nên có cả ý đúng lẫn ý sai.",

};
// Kiểu đáp án của câu Trả lời ngắn: so = điền số, chu = điền từ/cụm từ, ca_hai = số hoặc chữ tùy nội dung
const KIEU_DAP_AN={so:'Điền số', chu:'Điền chữ', ca_hai:'Số hoặc chữ'};
function kieuOf(f){ return KIEU_DAP_AN[f&&f.kieuDapAn] ? f.kieuDapAn : 'so'; }
const TLN_RULES={
  so:null,
  chu:"- Đáp án là MỘT từ hoặc cụm từ ngắn (tối đa 5 từ), là thuật ngữ chuẩn trong sách giáo khoa; không phải là số.\n- Chỉ một đáp án đúng duy nhất, tránh nội dung có nhiều cách diễn đạt khác nhau; chỗ trống đặt ở từ khóa của yêu cầu cần đạt.",
  ca_hai:"- Đáp án là MỘT con số HOẶC một từ/cụm từ ngắn (tối đa 5 từ), chọn loại nào phù hợp nhất với yêu cầu cần đạt.\n- Nếu là số: đơn vị in sẵn sau chỗ trống, nêu rõ cách làm tròn nếu cần. Nếu là chữ: dùng thuật ngữ chuẩn trong sách giáo khoa.\n- Chỉ một đáp án đúng duy nhất."
};
function inferDang(f){
  if(f.kind==='dung_sai') return 'dung_sai';
  const n=(f.name||'').toLowerCase();
  if(f.group==='TL' || n.includes('tự luận')) return 'tu_luan';
  if(n.includes('lựa chọn') || n.includes('trắc nghiệm')) return 'nhieu_lua_chon';
  if(n.includes('ngắn')) return 'tra_loi_ngan';
  return 'khac';
}
// Làm sạch dữ liệu đề đọc từ file sao lưu / bộ nhớ: ép kiểu số, giới hạn id và giá trị chọn sẵn
// để file .json bị sửa độc hại không chèn được mã vào trang.
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function safeId(v){ return String(v==null?'':v).replace(/[^\w-]/g,'_').slice(0,60) || 'x'; }
function safeNum(v,def,min,max){ let n=Number(v); if(!isFinite(n)) n=def; if(min!=null&&n<min) n=min; if(max!=null&&n>max) n=max; return n; }
function sanitizeState(s){
  if(!s || typeof s!=='object') s={};
  const d=defaultState();
  s.info=(s.info && typeof s.info==='object') ? s.info : {};
  ['tyLeNB','tyLeTH','tyLeVD'].forEach(k=>{ s.info[k]=safeNum(s.info[k], d.info[k], 0, 100); });
  ['ten','mon','lop','thoiGian','loai','truong','to','gv','ttcm','tuanTiet','ngay','lopApDung','namHoc','sach'].forEach(k=>{
    if(s.info[k]!=null && typeof s.info[k]!=='string') s.info[k]=String(s.info[k]);
  });
  s.info.kiemPhamVi = s.info.kiemPhamVi==='tietkiem' ? 'tietkiem' : 'all';
  ['hienThucHanh','kiemChung'].forEach(k=>{ if(s.info[k]!==undefined) s.info[k]=!!s.info[k]; });
  s.reallocRounds=safeNum(s.reallocRounds,0,0,100);
  { const bb={}, src=(s.badBuckets && typeof s.badBuckets==='object')?s.badBuckets:{}; Object.keys(src).forEach(k=>{ bb[k.replace(/[^\w|-]/g,'_')]=safeNum(src[k],0,0,100); }); s.badBuckets=bb; }
  s.examKey=safeId(s.examKey || ('de_'+Date.now()));
  s.formats=(Array.isArray(s.formats)?s.formats:d.formats).filter(f=>f && typeof f==='object').map(f=>{
    const dang = own(DANG_INFO,f.dang) ? f.dang : (f.dang===undefined ? undefined : 'khac');
    const o=Object.assign({},f,{
      id:safeId(f.id), name:String(f.name==null?'':f.name),
      tongSoCau:safeNum(f.tongSoCau,0,0,200), tongDiem:safeNum(f.tongDiem,0,0,100), soYMoiCau:safeNum(f.soYMoiCau,1,1,10),
      group:f.group==='TL'?'TL':'TNKQ', kind:f.kind==='dung_sai'?'dung_sai':'cau',
      choLevels:(Array.isArray(f.choLevels)?f.choLevels:[]).filter(l=>LEVELS.includes(l))
    });
    if(dang) o.dang=dang; else delete o.dang;
    if(o.kieuDapAn!==undefined && !own(KIEU_DAP_AN,o.kieuDapAn)) o.kieuDapAn='so';
    if(o.dsMode!==undefined && !['deu','chuan','tuy_chinh'].includes(o.dsMode)) delete o.dsMode;
    if(Array.isArray(o.dsBang)) o.dsBang=o.dsBang.map(x=>safeNum(x,0,0,100)); else delete o.dsBang;
    return o;
  });
  s.version = (+s.version>=2) ? 2 : (+s.version||1);
  s.topics=(Array.isArray(s.topics)?s.topics:[]).filter(t=>t && typeof t==='object').map(t=>{
    const fixLv=lv=>{ lv=(lv && typeof lv==='object')?lv:{}; const al={};
      Object.keys((lv.alloc && typeof lv.alloc==='object')?lv.alloc:{}).forEach(k=>{ al[safeId(k)]=safeNum(lv.alloc[k],0,0,500); });
      return {yccd:String(lv.yccd==null?'':lv.yccd), alloc:al}; };
    const o=Object.assign({},t,{id:safeId(t.id), name:String(t.name==null?'':t.name)});
    if(Array.isArray(t.units)) o.units=t.units.filter(u=>u && typeof u==='object').map(u=>{
      const lv=(u.levels && typeof u.levels==='object')?u.levels:{};
      return Object.assign({},u,{id:safeId(u.id), name:String(u.name==null?'':u.name), tietHoc:safeNum(u.tietHoc,1,0,500),
        sgk:String(u.sgk==null?'':u.sgk), ngoai:String(u.ngoai==null?'':u.ngoai), khongKT:!!u.khongKT,
        levels:{NB:fixLv(lv.NB),TH:fixLv(lv.TH),VD:fixLv(lv.VD)}});
    });
    else if(t.levels && typeof t.levels==='object'){ // đề cũ (phân bổ theo chủ đề)
      o.levels={NB:fixLv(t.levels.NB),TH:fixLv(t.levels.TH),VD:fixLv(t.levels.VD)};
      o.tietHoc=safeNum(t.tietHoc,1,0,500); o.noiDung=String(t.noiDung==null?'':t.noiDung);
    }
    return o;
  });
  // câu hỏi: khóa chỉ gồm chữ, số, _, -, | (khớp với id đã làm sạch); câu cũ (prev) làm sạch như câu hiện tại
  const cleanQ=(q,deep)=>{
    if(!q || typeof q!=='object') return null; const o={};
    ['noidung','dapan','giaithich','trichdan','canhoi','kiem','sig','ysig','hinhMoTa'].forEach(f=>{ if(q[f]!==undefined) o[f]=String(q[f]); });
    if(q.hinh && typeof q.hinh==='object' && typeof q.hinh.data==='string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(q.hinh.data))
      o.hinh={data:q.hinh.data, w:safeNum(q.hinh.w,100,1,4000), h:safeNum(q.hinh.h,100,1,4000)};
    if(deep && q.prev){ const pv=cleanQ(q.prev,false); if(pv) o.prev=pv; }
    return o;
  };
  const qs={}, src=(s.questions && typeof s.questions==='object')?s.questions:{};
  Object.keys(src).forEach(k=>{ const o=cleanQ(src[k],true); if(o) qs[k.replace(/[^\w|-]/g,'_')]=o; });
  s.questions=qs;
  if(s.aiRules && typeof s.aiRules==='object'){ const r={}; Object.keys(s.aiRules).forEach(k=>{ if(typeof s.aiRules[k]==='string') r[k]=s.aiRules[k]; }); s.aiRules=r; } else delete s.aiRules;
  return s;
}
// Bổ sung các trường mới cho đề cũ (đọc từ bộ nhớ hoặc file sao lưu)
function ensureStateDefaults(s){
  s = sanitizeState(s);
  const d = defaultState();
  s.info = Object.assign({}, d.info, s.info||{});
  migrateV2(s);
  (s.formats||[]).forEach(f=>{ if(!f.dang) f.dang=inferDang(f); if(!f.group) f.group=DANG_INFO[f.dang].group; if(f.dang==='tra_loi_ngan' && !KIEU_DAP_AN[f.kieuDapAn]) f.kieuDapAn='so'; });
  s.aiRules = Object.assign({}, DEFAULT_AI_RULES, s.aiRules||{});
  return s;
}
function setDang(idx,v){
  const f=state.formats[idx], di=DANG_INFO[v];
  f.dang=v; f.group=di.group; f.kind=di.kind; if(v==='tra_loi_ngan' && !KIEU_DAP_AN[f.kieuDapAn]) f.kieuDapAn='so';
  f.soYMoiCau = (v==='dung_sai') ? (f.soYMoiCau>1?f.soYMoiCau:4) : 1;
  render();
}
// Bảng điểm câu Đúng–Sai theo số ý đúng (chỉ dùng cho hướng dẫn chấm; ma trận vẫn tính đều theo ý)
function dsBangOf(f){
  const per=+f.soYMoiCau||4, dc=diemMoiCauThuc(f);
  if(f.dsMode==='chuan' && per===4) return [0.1,0.25,0.5,1].map(x=>fmt(x*dc));
  if(f.dsMode==='tuy_chinh' && Array.isArray(f.dsBang) && f.dsBang.length===per) return f.dsBang.map(Number);
  return Array.from({length:per},(_,j)=>fmt(dc*(j+1)/per));
}
function setDsMode(idx,m){ state.formats[idx].dsMode=m; render(); }
function setDsVal(idx,j,v){
  const f=state.formats[idx]; const b=dsBangOf(f);
  b[j]=Math.max(0,+v||0); f.dsBang=b; f.dsMode='tuy_chinh'; render();
}
function viewDsScoring(){
  const list=state.formats.map((f,idx)=>({f,idx})).filter(x=>x.f.kind==='dung_sai');
  if(!list.length) return '';
  let h=`<div class="card"><h2>Cách chấm câu Đúng – Sai</h2>
  <p class="muted" style="margin-bottom:10px;">Bảng này dùng cho hướng dẫn chấm. Ma trận và đặc tả vẫn tính điểm đều theo từng ý.</p>`;
  list.forEach(({f,idx})=>{
    const b=dsBangOf(f), dc=diemMoiCauThuc(f), per=+f.soYMoiCau||4;
    const mode=(f.dsMode==='chuan'||f.dsMode==='tuy_chinh')?f.dsMode:'deu';
    const okMax=Math.abs(b[b.length-1]-dc)<0.001;
    h+=`<div class="topic-block"><b>${esc(f.name)}</b> <span class="muted">— mỗi câu tối đa ${fmt(dc)} điểm</span>
      <div class="flex" style="margin:8px 0;">
        <button class="small ${mode==='deu'?'primary':''}" onclick="setDsMode(${idx},'deu')">Đều nhau (như mẫu)</button>
        ${per===4?`<button class="small ${mode==='chuan'?'primary':''}" onclick="setDsMode(${idx},'chuan')">Thang 0,1 – 0,25 – 0,5 – 1,0</button>`:''}
        <span class="pill ${mode==='tuy_chinh'?'ok':''}" style="${mode==='tuy_chinh'?'':'display:none'}">Tự chỉnh</span>
      </div>
      <div class="alloc-row">${b.map((v,j)=>`<div class="alloc-cell"><span>Đúng ${j+1} ý</span><input type="number" step="0.05" min="0" value="${v}" onchange="setDsVal(${idx},${j},this.value)"></div>`).join('')}</div>
      ${okMax?'':`<p style="margin-top:8px;"><span class="pill bad">Đúng đủ ${per} ý phải bằng ${fmt(dc)} điểm</span></p>`}
    </div>`;
  });
  return h+`</div>`;
}
function viewAiRules(){
  const r=state.aiRules||DEFAULT_AI_RULES;
  let h=`<div class="card"><h2>Quy tắc AI soạn câu hỏi</h2>
  <p class="muted" style="margin-bottom:10px;">AI luôn làm theo các quy tắc này khi soạn câu hỏi và đáp án. Thầy sửa trực tiếp được.</p>`;
  Object.keys(AI_RULE_LABELS).forEach(k=>{
    h+=`<div style="margin-bottom:10px;"><label>${AI_RULE_LABELS[k]}</label><textarea rows="4" oninput="state.aiRules['${k}']=this.value">${esc(r[k]||'')}</textarea></div>`;
  });
  return h+`<button class="small" onclick="resetAiRules()">Đặt lại quy tắc mặc định</button></div>`;
}
function resetAiRules(){
  if(!confirm("Đặt lại tất cả quy tắc AI về mặc định?")) return;
  state.aiRules=JSON.parse(JSON.stringify(DEFAULT_AI_RULES)); render();
}

      tyLeNB: 40, tyLeTH: 30, tyLeVD: 30
    },

  };

let state = defaultState();
let activeTab = "setup";

/* ---------------- HELPERS ---------------- */
function diemMoiCau(f){
  if(f.tongSoCau<=0) return 0;
  if(f.kind==="dung_sai"){
    return f.tongDiem/(f.tongSoCau*f.soYMoiCau);
  }
  return f.tongDiem/f.tongSoCau;
}
// Điểm thực nhận được cho 1 CÂU (không phải 1 ý) - dùng để cộng tổng điểm theo số câu đã phân bổ
function diemMoiCauThuc(f){
  if(f.tongSoCau<=0) return 0;
  return f.tongDiem/f.tongSoCau;
}
function fmt(n){ return Math.round(n*1000)/1000; }

function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
// Số "đơn vị phân bổ" của 1 hình thức: câu thường tính theo câu, câu Đúng–Sai tính theo Ý
function soDonVi(f){ return f.kind==='dung_sai' ? (+f.tongSoCau||0)*(+f.soYMoiCau||0) : (+f.tongSoCau||0); }
function diemDV(f){ const n=soDonVi(f); return n>0 ? f.tongDiem/n : 0; }
function allUnits(){ const r=[]; state.topics.forEach(t=>t.units.forEach(u=>r.push({topic:t,unit:u}))); return r; }
function newUnit(name,tiet){ return {id:uid('u'), name:name||'Bài mới', tietHoc:(tiet==null?1:tiet), sgk:'', ngoai:'', levels:{NB:{yccd:'',alloc:{}},TH:{yccd:'',alloc:{}},VD:{yccd:'',alloc:{}}}}; }
function sumAllocForFormat(fid){ let s=0; allUnits().forEach(({unit})=>LEVELS.forEach(l=>{ s+=unit.levels[l].alloc[fid]||0; })); return s; }
function sumDiemForLevel(level){ let s=0; allUnits().forEach(({unit})=>state.formats.forEach(f=>{ s+=(unit.levels[level].alloc[f.id]||0)*diemDV(f); })); return s; }
function tongDiemDe(){ return state.formats.reduce((s,f)=>s+f.tongDiem,0); }
// Số tiết của chủ đề tính cả bài thực hành. Chủ đề chỉ toàn bài thực hành không có câu nào nên không tính vào phần điểm.
function tietTopic(t){ return testUnits(t).length ? t.units.reduce((s,u)=>s+(+u.tietHoc||0),0) : 0; }
// Bài thực hành / không kiểm tra: không phân bổ câu, không đưa vào ma trận và đặc tả
function testUnits(t){ return t.units.filter(u=>!u.khongKT); }
function testTopics(){ return state.topics.filter(t=>testUnits(t).length); }
// Bài/chủ đề hiển thị trong ma trận và đặc tả: có thể gồm cả bài thực hành (không có câu) tùy lựa chọn
function shownUnits(t){ return state.info.hienThucHanh===false ? testUnits(t) : t.units; }
function shownTopics(){ return state.topics.filter(t=>shownUnits(t).length); }
function toggleKhongKT(ti,ui,v){
  const u=state.topics[ti].units[ui];
  const n=LEVELS.reduce((a,l)=>a+Object.values(u.levels[l].alloc).reduce((x,y)=>x+y,0),0);
  if(v && n && !confirm('Bài này đang được phân bổ '+n+' câu. Bỏ các câu đó và không đưa bài vào đề?')){ render(); return; }
  u.khongKT=!!v;
  if(v) LEVELS.forEach(l=>{ u.levels[l].alloc={}; });
  render();
}
function tongTietHoc(){ return state.topics.reduce((s,t)=>s+tietTopic(t),0); }
function diemUnit(u){ let s=0; LEVELS.forEach(l=>state.formats.forEach(f=>{ s+=(u.levels[l].alloc[f.id]||0)*diemDV(f); })); return s; }
function diemDaPhanBoTopic(t){ return t.units.reduce((s,u)=>s+diemUnit(u),0); }
// Chuyển đề cũ (phân bổ theo chủ đề, câu Đúng–Sai tính theo câu) sang cấu trúc mới (theo bài, Đúng–Sai tính theo ý)
function migrateV2(s){
  s.questions=s.questions||{};
  if(s.version>=2 && s.topics.every(t=>t.units)){ return s; }
  const ds=s.formats.filter(f=>f.kind==='dung_sai'), di={}; ds.forEach(f=>di[f.id]=0);
  s.topics=s.topics.map(t=>{
    if(t.units) return t;
    const lv=t.levels;
    ds.forEach(f=>LEVELS.forEach(l=>{
      const n=lv[l].alloc[f.id]||0;
      for(let k=0;k<n;k++){ const ok=`${t.id}|${l}|${f.id}|${k}`; if(s.questions[ok]){ s.questions[`${f.id}|ds|${di[f.id]}`]=s.questions[ok]; delete s.questions[ok]; } di[f.id]++; }
      if(n) lv[l].alloc[f.id]=n*(+f.soYMoiCau||1);
    }));
    const nd=(t.noiDung||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).join('; ');
    return {id:t.id, name:t.name, units:[{id:t.id, name:nd||t.name, tietHoc:t.tietHoc, levels:lv}]};
  });
  s.version=2; return s;
}

function toast(msg){
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),Math.max(2200,String(msg).length*70));
}

/* ---------------- PERSISTENCE ---------------- */
// Lớp lưu trữ thống nhất: ưu tiên window.storage (khi chạy trong artifact Claude),
// tự động chuyển sang localStorage khi mở file .html độc lập ngoài trình duyệt.
const hasClaudeStorage = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
const LS_PREFIX = 'dekiemtra_';
const localStore = {
  async get(key){
    const raw = localStorage.getItem(LS_PREFIX+key);
    if(raw===null) throw new Error('not found');
    return { key, value: raw };
  },
  async set(key, value){
    localStorage.setItem(LS_PREFIX+key, value);
    return { key, value };
  }
};
const store = hasClaudeStorage ? window.storage : localStore;

async function saveExam(){
  try{
    const list = await safeGet('exam_list', []);
    if(!list.includes(state.examKey)) list.push(state.examKey);
    await store.set('exam_list', JSON.stringify(list));
    await store.set(state.examKey, JSON.stringify(state));
    toast("Đã lưu: " + state.info.ten + (hasClaudeStorage?'':' (lưu trên trình duyệt này)'));
  }catch(e){ toast("Lỗi lưu: "+e.message); }
}
async function safeGet(key, fallback){
  try{
    const r = await store.get(key);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function openLoadDialog(){
  const list = await safeGet('exam_list', []);
  if(list.length===0){ toast("Chưa có đề nào được lưu."); return; }
  const items = [];
  for(const k of list){
    const d = await safeGet(k,null);
    if(d) items.push({key:k, label:`${d.info.ten} – ${d.info.mon} lớp ${d.info.lop}`});
  }
  const choice = prompt("Nhập số thứ tự đề muốn mở:\n" + items.map((it,i)=>`${i+1}. ${it.label}`).join("\n"));
  const idx = parseInt(choice)-1;
  if(items[idx]){
    const d = await safeGet(items[idx].key, null);
    if(d){ state = ensureStateDefaults(d); render(); toast("Đã mở: "+d.info.ten); }
  }
}
function newExam(){
  if(confirm("Tạo đề mới? (đề hiện tại nếu chưa lưu sẽ mất)")){
    state = defaultState(); render();
  }
}
function exportBackupJson(){
  const filename = 'sao_luu_' + (state.info.ten||'de_kiem_tra').replace(/\s+/g,'_') + '.json';
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('✓ Đã tải file sao lưu: ' + filename);
}
function importBackupJson(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed!=='object' || !parsed.info || typeof parsed.info!=='object'){ toast('File sao lưu không hợp lệ.'); return; }
      state = ensureStateDefaults(parsed);
      render();
      toast('✓ Đã nhập lại đề: ' + (state.info.ten||''));
    }catch(err){
      toast('Lỗi đọc file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function getProvider(role){

  const gk = getApiKeys().length>0;
  let sel = localStorage.getItem('ai_role_'+role) || (role==='soan'?'openai':'gemini');
  if(sel==='openai' && !ok) sel='gemini';
  if(sel==='gemini' && !gk && ok) sel='openai';

async function callOpenAI(prompt,temp,mult){
  const keys=getOpenAIKeys();
  if(openaiIdx>=keys.length) openaiIdx=0;
  const key=keys[openaiIdx]||'';
  if(!key) throw new Error('Chưa nhập OpenAI API key (Tab 1).');
  const model=localStorage.getItem('openai_model')||'gpt-4o-mini';
  const body={ model, messages:[{role:'user',content:prompt}], max_completion_tokens:4096*(mult||1) };
  if(!/^(gpt-5|o\d)/.test(model)) body.temperature=(temp==null?0.5:temp);
  if(/^(gpt-5(?!-chat)|o\d)/.test(model)) body.reasoning_effort='low';
  const response=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify(body)
  });
  if(!response.ok){
    const err=await response.json().catch(()=>({}));
    const msg=err?.error?.message||response.statusText;
    if(['insufficient_quota','credit_balance_exhausted'].includes(err?.error?.code)){
      const e=new Error('RATE_LIMIT'); e.isRateLimit=true; e.noCredit=true; throw e;
    }
    if(response.status===401) throw new Error('OpenAI API key không hợp lệ. Kiểm tra lại ở Tab 1. ('+msg+')');
    if(response.status===404) throw new Error('Model OpenAI không tồn tại hoặc tài khoản chưa có quyền dùng. ('+msg+')');
    if(response.status===429){
      const e=new Error('RATE_LIMIT'); e.isRateLimit=true;
      if(err?.error?.code==='insufficient_quota') e.noCredit=true;
      throw e;
    }
    throw new Error('Lỗi OpenAI API ('+response.status+'): '+msg);
  }
  const data=await response.json();
  const ch=data?.choices?.[0];
  const text=ch?.message?.content||'';
  if(!text) throw new Error('OpenAI không trả về nội dung (finish_reason: '+(ch?.finish_reason||'không rõ')+').');
  if(ch?.finish_reason==='length'){
    const e=new Error('Nội dung bị cắt cụt do vượt giới hạn độ dài. Đang thử lại...'); e.isTruncated=true; throw e;
  }
  return text;
}
async function callOpenAIWithRetry(prompt,temp){
  const backoffs=[15000,30000,45000];
  let attempt=0, mult=1;
  while(attempt<4){
    try{ return await callOpenAI(prompt,temp,mult); }
    catch(e){
      const isLast=attempt===3;
      if(e.isRateLimit){
        if(rotateOpenAIKey()){ toast(e.noCredit?'⚠ Key OpenAI hết credit — chuyển sang key kế tiếp...':'⚠ Key OpenAI bị giới hạn — chuyển sang key kế tiếp...'); continue; }
        if(e.noCredit) throw new Error('Tất cả key OpenAI đã hết credit. Nạp thêm tại platform.openai.com hoặc chuyển sang Gemini.');
        if(!isLast){ await sleep(backoffs[attempt]||45000); openaiIdx=0; attempt++; continue; }
        throw new Error('OpenAI đang giới hạn tốc độ (429) trên tất cả các key. Đợi 1 phút rồi thử lại, hoặc chuyển sang Gemini.');
      }
      if(e.isTruncated && !isLast){ mult=Math.min(mult*2,4); await sleep(500); attempt++; continue; }
      throw e;
    }
  }
}

/* ---------------- TAB 2: TOPICS & ALLOCATION ---------------- */
function allocateInts(total, weights){
  const sumW = weights.reduce((a,b)=>a+b,0);
  if(sumW<=0 || total<=0) return weights.map(()=>0);
  const raw = weights.map(w=> total*Math.max(0,w)/sumW);
  const floors = raw.map(Math.floor);
  let remainder = Math.round(total - floors.reduce((a,b)=>a+b,0));
  const order = raw.map((r,i)=>({i,frac:r-Math.floor(r)})).sort((a,b)=>b.frac-a.frac);
  const result = floors.slice();
  for(let k=0;k<remainder && order.length>0;k++){ result[order[k%order.length].i]++; }
  return result;
}
// Tính số câu mỗi (hình thức × mức độ) ở cấp TOÀN ĐỀ sao cho % điểm mỗi mức độ
// (Biết/Hiểu/Vận dụng) khớp đúng tỉ lệ mục tiêu, có tính đến việc một số hình thức
// (vd. Tự luận) không áp dụng cho mọi mức độ.
function computeGlobalLevelCounts(){
  let counts = {};
  state.formats.forEach(f=>{
    counts[f.id] = {NB:0,TH:0,VD:0};
    const levels = f.choLevels;
    if(levels.length===0) return;
    const weights = levels.map(l=> +state.info['tyLe'+l] || 1);
    const c = allocateInts(soDonVi(f), weights);
    levels.forEach((l,idx)=>{ counts[f.id][l] = c[idx]; });
  });

  const total = tongDiemDe();
  const target = {
    NB: total*(+state.info.tyLeNB||0)/100,
    TH: total*(+state.info.tyLeTH||0)/100,
    VD: total*(+state.info.tyLeVD||0)/100
  };
  function globalLevel(l){
    let s=0; state.formats.forEach(f=>{ s += (counts[f.id][l]||0)*diemDV(f); });
    return s;
  }

  for(let iter=0; iter<3000; iter++){
    const G = {NB:globalLevel('NB'), TH:globalLevel('TH'), VD:globalLevel('VD')};
    const dev = {NB:G.NB-target.NB, TH:G.TH-target.TH, VD:G.VD-target.VD};
    const sorted = LEVELS.slice().sort((a,b)=>dev[b]-dev[a]); // thừa nhiều -> thiếu nhiều
    if(dev[sorted[0]] - dev[sorted[sorted.length-1]] <= 0.05) break; // đã đủ sát

    let moved=false;
    outer:
    for(let i=0;i<sorted.length;i++){
      for(let j=sorted.length-1;j>i;j--){
        const lOver=sorted[i], lUnder=sorted[j];
        if(dev[lOver]-dev[lUnder] <= 0.05) continue;
        const candidates = state.formats
          .filter(f=> f.choLevels.includes(lOver) && f.choLevels.includes(lUnder) && counts[f.id][lOver]>0)
          .sort((x,y)=> diemDV(x)-diemDV(y)); // ưu tiên đơn vị nhỏ để tinh chỉnh mịn
        if(candidates.length>0){
          const f = candidates[0];
          counts[f.id][lOver] -= 1;
          counts[f.id][lUnder] += 1;
          moved = true;
          break outer;
        }
      }
    }
    if(!moved) break; // không còn cách chuyển khả thi (do giới hạn hình thức/mức độ)
  }
  return counts;
}

// Chia sẵn tổng số ý theo hàng (chủ đề) và cột (mức độ), giữ nguyên tổng mỗi hàng
function transport(rows, cols){
  const M=rows.map(r=>allocateInts(r, cols.slice()));
  for(let it=0; it<500; it++){
    const cs=cols.map((_,j)=>M.reduce((a,row)=>a+row[j],0)), dev=cs.map((v,j)=>v-cols[j]);
    let over=-1, under=-1;
    dev.forEach((d,j)=>{ if(d>0&&(over<0||d>dev[over])) over=j; if(d<0&&(under<0||d<dev[under])) under=j; });
    if(over<0||under<0) break;
    let bi=-1; M.forEach((row,i)=>{ if(row[over]>0&&(bi<0||row[over]>M[bi][over])) bi=i; });
    if(bi<0) break;
    M[bi][over]--; M[bi][under]++;
  }
  return M;
}
/* ---------------- PHÂN BỔ TRẢ LỜI NGẮN THEO KIỂU ĐÁP ÁN + PHÂN BỔ LẠI CÂU LỖI ---------------- */
const TLN_NUM_CUES=['tính','xác định','đo ','đo,','phép đo','đếm','cân bằng','khối lượng','phân tử khối','hóa trị','số hiệu','số khối','vận tốc','tốc độ','quãng đường','nhiệt độ','áp suất','tần số','độ lớn','tỉ khối','bao nhiêu','số lượng'];
const TLN_TXT_CUES=['nêu','nhận biết','gọi tên','kể tên','phát biểu','nhận dạng','liệt kê','phân biệt','mô tả','trình bày','cho biết tên','tên '];
// Độ hợp (0,5 / 1 / 3) giữa yêu cầu cần đạt của một bài-mức và kiểu đáp án của câu Trả lời ngắn
function tlnFit(u,l,kieu){
  if(kieu==='ca_hai') return 1;
  const t=yccdLines(u,l).join(' ').toLowerCase();
  const num=TLN_NUM_CUES.some(c=>t.includes(c)), txt=TLN_TXT_CUES.some(c=>t.includes(c));
  if(kieu==='so') return num?2:(txt?0.6:1);
  return (txt&&!num)?2:(num&&!txt?0.6:1);
}
// Câu AI không soạn ra được (AI hỏi lại / thiếu thông tin) - không tính câu thiếu yêu cầu cần đạt (phải nhập yêu cầu, dời chỗ không giúp được)
function failedSlots(){

}

function reallocFailed(){
  if(typeof aiGenerating!=='undefined' && aiGenerating){ toast('Đang soạn câu, vui lòng chờ...'); return; }
  const failed=failedSlots();
  if(!failed.length){ toast('Không có câu nào bị lỗi cần phân bổ lại.'); return; }
  state.badBuckets=state.badBuckets||{}; state.reallocRounds=+state.reallocRounds||0;
  if(state.reallocRounds>=3 && !confirm('Đã phân bổ lại '+state.reallocRounds+' lần mà vẫn còn câu lỗi.\nThường là do yêu cầu cần đạt mơ hồ hoặc chưa nạp nội dung SGK của bài đó.\nVẫn phân bổ lại thêm một lần nữa?')) return;
  const slots0=buildSlots();
  // ghi nhớ: câu nào đang khớp yêu cầu cần đạt (để dời chỗ xong không bị báo "yêu cầu đã đổi" oan); gỡ các câu Đúng–Sai ra để ghép lại theo chữ ký
  const oldDs=[];
  slots0.forEach(sl=>{
    const q=state.questions[sl.key];
    if(q && q.noidung) q._ysOk=(q.ysig===undefined || q.ysig===yccdSigOf(sl));
    if(sl.format.kind==='dung_sai'){ if(q && q.noidung && q.sig) oldDs.push({q,sig:q.sig}); delete state.questions[sl.key]; }
  });
  const bk=(u,l,f)=>u.id+'|'+l+'|'+f.id;
  const cntU=u=>LEVELS.reduce((a,l)=>a+state.formats.reduce((b,f)=>b+(u.levels[l].alloc[f.id]||0),0),0);
  const flat=allUnits().filter(x=>!x.unit.khongKT);
  const pickDest=(f,l,src,srcTopic)=>{
    let best=null, bs=-Infinity;
    flat.forEach(({topic,unit})=>{
      if(unit===src || !hasYccd(unit,l) || !f.choLevels.includes(l)) return;
      if(state.badBuckets[bk(unit,l,f)]) return;
      let sc=(topic===srcTopic?1000:0) - (unit.levels[l].alloc[f.id]||0)*3 - cntU(unit);
      if(cntU(unit)===0) sc+=50;
      if(f.dang==='tra_loi_ngan') sc+=tlnFit(unit,l,kieuOf(f))*10;
      if(sc>bs){ bs=sc; best=unit; }
    });
    return best;
  };
  let moved=0, stuck=0, sameTopic=0;
  const addTo=(dst,l,f,withKey)=>{
    const da=dst.levels[l].alloc, m=da[f.id]||0;
    if(withKey) delete state.questions[`${dst.id}|${l}|${f.id}|${m}`];
    da[f.id]=m+1;
  };
  // câu thường: xử lý từ chỉ số lớn về nhỏ trong cùng một ô để chỉ số không bị lệch
  const normal=failed.filter(sl=>sl.format.kind!=='dung_sai').sort((a,b)=>b.items[0].k-a.items[0].k);
  normal.forEach(sl=>{
    const it=sl.items[0], f=sl.format, l=it.level, src=it.unit;
    state.badBuckets[bk(src,l,f)]=(state.badBuckets[bk(src,l,f)]||0)+1;
    const dst=pickDest(f,l,src,it.topic);
    if(!dst){ stuck++; return; }
    const al=src.levels[l].alloc, n=al[f.id]||0, K=j=>`${src.id}|${l}|${f.id}|${j}`;
    delete state.questions[K(it.k)];
    for(let j=it.k+1;j<n;j++){ if(state.questions[K(j)]) state.questions[K(j-1)]=state.questions[K(j)]; delete state.questions[K(j)]; }
    if(n-1>0) al[f.id]=n-1; else delete al[f.id];
    addTo(dst,l,f,true); moved++;
    if(state.topics.some(t=>t.units.includes(dst)&&t===it.topic)) sameTopic++;
  });
  // câu Đúng–Sai: dời từng ý của câu lỗi
  failed.filter(sl=>sl.format.kind==='dung_sai').forEach(sl=>{
    const counted=new Set();
    sl.items.forEach(it=>{
      const f=sl.format, l=it.level, src=it.unit;
      if(!counted.has(bk(src,l,f))){ counted.add(bk(src,l,f)); state.badBuckets[bk(src,l,f)]=(state.badBuckets[bk(src,l,f)]||0)+1; }
      const dst=pickDest(f,l,src,it.topic);
      if(!dst){ stuck++; return; }
      const al=src.levels[l].alloc, n=al[f.id]||0;
      if(n-1>0) al[f.id]=n-1; else delete al[f.id];
      addTo(dst,l,f,false); moved++;
      if(it.topic.units.includes(dst)) sameTopic++;
    });
  });
  // ghép lại câu Đúng–Sai đã soạn tốt theo chữ ký (bài + mức của từng ý)
  const ns=buildSlots(), used=new Set();
  ns.forEach(sl=>{
    if(sl.format.kind!=='dung_sai') return;
    const sg=slotSig(sl), i=oldDs.findIndex((o,ix)=>!used.has(ix) && o.sig===sg);
    if(i>=0){ used.add(i); state.questions[sl.key]=oldDs[i].q; }
  });
  const dsLost=oldDs.length-used.size;
  ns.forEach(sl=>{ const q=state.questions[sl.key]; if(q){ if(q._ysOk) q.ysig=yccdSigOf(sl); delete q._ysOk; } });
  state.reallocRounds++;
  // bài bị lỗi nhiều lần -> nhắc kiểm tra gốc
  const worst=[]; allUnits().forEach(({unit})=>{ let c=0; Object.keys(state.badBuckets).forEach(k=>{ if(k.startsWith(unit.id+'|')) c+=state.badBuckets[k]; }); if(c>=2) worst.push(unit.name); });
  render();
  toast(`🔁 Đã chuyển ${moved} câu/ý sang bài khác (cùng mức độ, cùng hình thức; tổng số câu và tỉ lệ mức độ không đổi).`
    +(moved&&sameTopic<moved?` ${moved-sameTopic} câu/ý phải sang chủ đề khác nên điểm chủ đề có thể lệch.`:'')
    +(stuck?` ${stuck} câu/ý chưa có chỗ phù hợp để chuyển.`:'')
    +(dsLost>0?` ${dsLost} câu Đúng–Sai đã soạn bị đổi cụm ý nên cần soạn lại.`:'')
    +(worst.length?` Bài lỗi nhiều lần, nên xem lại yêu cầu cần đạt/SGK: ${worst.join('; ')}.`:'')
    +' Bấm 🤖 AI soạn các câu còn trống để soạn các câu vừa chuyển.');
}
function autoAllocate(){
  if(!state.topics.length || state.topics.some(t=>!t.units.length)){ toast("Mỗi chủ đề cần ít nhất 1 bài."); return; }
  const hasAny=allUnits().some(({unit})=>!unit.khongKT && LEVELS.some(l=>hasYccd(unit,l)));
  if(!hasAny){ toast("Chưa có yêu cầu cần đạt nào. Hãy nhập yêu cầu cần đạt cho các bài trước, rồi mới phân bổ số câu."); return; }
  state.badBuckets={}; state.reallocRounds=0;
  const eligT=(ti,l)=>state.topics[ti].units.some(u=>!u.khongKT && hasYccd(u,l));
  const tW=state.topics.map(t=>testUnits(t).length ? (tietTopic(t)||0.001) : 0), gc=computeGlobalLevelCounts();
  const A=state.topics.map(()=>({NB:{},TH:{},VD:{}}));
  state.formats.forEach(f=>{
    if(f.kind==='dung_sai'){
      // mỗi câu Đúng–Sai thuộc 1 chủ đề: chia số câu theo tiết, rồi chia ý theo mức độ
      const per=+f.soYMoiCau||1, rows=allocateInts(+f.tongSoCau||0,tW).map(c=>c*per);
      transport(rows, LEVELS.map(l=>gc[f.id][l]||0)).forEach((row,ti)=>LEVELS.forEach((l,li)=>{ A[ti][l][f.id]=row[li]; }));
    } else {
      const isTln=f.dang==='tra_loi_ngan', kieu=kieuOf(f);
      f.choLevels.forEach(l=>{
        const w=tW.map((x,ti)=>{
          if(!eligT(ti,l)) return 0;
          if(!isTln) return x;
          // Trả lời ngắn: nhân trọng số theo độ hợp giữa yêu cầu cần đạt và kiểu đáp án (Điền số / Điền chữ)
          const us=state.topics[ti].units.filter(u=>!u.khongKT && hasYccd(u,l));
          const tot=us.reduce((a,u)=>a+(+u.tietHoc||0.001),0)||1;
          return x*us.reduce((a,u)=>a+(+u.tietHoc||0.001)*tlnFit(u,l,kieu),0)/tot;
        });
        allocateInts(gc[f.id][l]||0, w.some(x=>x>0)?w:tW).forEach((n,ti)=>{ A[ti][l][f.id]=n; });
      });
    }
  });
  const total=tongDiemDe(), tong=tongTietHoc(), TOL=0.25;
  const targets=state.topics.map(t=>tong? total*tietTopic(t)/tong : 0);
  const dT=ti=>{ let x=0; LEVELS.forEach(l=>state.formats.forEach(f=>{ x+=(A[ti][l][f.id]||0)*diemDV(f); })); return x; };
  const tFit=(ti,l,f)=>{ if(f.dang!=='tra_loi_ngan') return 1; let m=0; state.topics[ti].units.forEach(u=>{ if(!u.khongKT && hasYccd(u,l)) m=Math.max(m,tlnFit(u,l,kieuOf(f))); }); return m; };
  const move=(a,b)=>{
    let best=null, bv=Infinity, bl=Infinity;
    state.formats.forEach(f=>{ if(f.kind==='dung_sai') return; f.choLevels.forEach(l=>{
      if(!((A[a][l][f.id]||0)>0)) return;
      const loss=Math.max(0, tFit(a,l,f)-tFit(b,l,f)), dv=diemDV(f);
      if(loss<bl || (loss===bl && dv<bv)){ bl=loss; bv=dv; best={f,l}; }
    }); });
    if(!best) return false;
    A[a][best.l][best.f.id]--; A[b][best.l][best.f.id]=(A[b][best.l][best.f.id]||0)+1; return true;
  };
  for(let it=0; it<800; it++){
    const devs=state.topics.map((t,i)=>dT(i)-targets[i]); let mx=0, mi=-1;
    devs.forEach((d,i)=>{ if(Math.abs(d)>Math.abs(mx)){ mx=d; mi=i; } });
    if(Math.abs(mx)<=TOL) break;
    let ok;
    if(mx>0){ const to=devs.indexOf(Math.min(...devs)); ok=(to!==mi)&&move(mi,to); }
    else { const fr=devs.indexOf(Math.max(...devs)); ok=(fr!==mi)&&move(fr,mi); }
    if(!ok) break;
  }
  // Sửa lại: câu nào rơi vào chủ đề/mức chưa có yêu cầu cần đạt thì chuyển sang chỗ có; nếu không còn chỗ nào thì bỏ
  let chuyen=0, bo=0;
  state.topics.forEach((t,ti)=>LEVELS.forEach(l=>{
    if(eligT(ti,l)) return;
    state.formats.forEach(f=>{
      let n=A[ti][l][f.id]||0; if(!n) return; A[ti][l][f.id]=0;
      while(n-->0){
        let dest=null;
        const sameLv=state.topics.map((_,tj)=>tj).filter(tj=>tj!==ti && eligT(tj,l) && f.choLevels.includes(l));
        if(sameLv.length){ dest=[sameLv.sort((a,b)=>(targets[b]-dT(b))-(targets[a]-dT(a)))[0], l]; }
        else {
          const lv2=f.choLevels.filter(x=>x!==l && eligT(ti,x));
          if(lv2.length) dest=[ti,lv2[0]];
          else { for(const tj of state.topics.map((_,k)=>k)) { const x=f.choLevels.find(L=>eligT(tj,L)); if(x){ dest=[tj,x]; break; } } }
        }
        if(dest){ A[dest[0]][dest[1]][f.id]=(A[dest[0]][dest[1]][f.id]||0)+1; chuyen++; } else bo++;
      }
    });
  }));
  const bad=state.topics.some((t,i)=>Math.abs(dT(i)-targets[i])>TOL);
  // chia tiếp từ chủ đề xuống từng bài theo số tiết
  state.topics.forEach((t,ti)=>{
    t.units.forEach(u=>LEVELS.forEach(l=>{ u.levels[l].alloc={}; }));
    state.formats.forEach(f=>LEVELS.forEach(l=>{
      const n=A[ti][l][f.id]||0; if(!n) return;
      const uW=t.units.map(u=>(u.khongKT||!hasYccd(u,l)) ? 0 : (+u.tietHoc||0.001)*(f.dang==='tra_loi_ngan'?tlnFit(u,l,kieuOf(f)):1));
      allocateInts(n,uW).forEach((c,ui)=>{ if(c) t.units[ui].levels[l].alloc[f.id]=c; });
    }));
  });
  // Đảm bảo mỗi bài có ít nhất 1 câu (nếu tổng số câu đủ). Lấy 1 câu từ bài đang có nhiều câu, cùng hình thức và cùng mức độ nên tổng toàn đề và tỉ lệ mức độ không đổi. Ưu tiên lấy trong cùng chủ đề.
  const cntU=u=>LEVELS.reduce((a,l)=>a+state.formats.reduce((b,f)=>b+(u.levels[l].alloc[f.id]||0),0),0);
  const flat=allUnits().filter(x=>!x.unit.khongKT), devT=t=>diemDaPhanBoTopic(t)-targets[state.topics.indexOf(t)];
  flat.filter(x=>cntU(x.unit)===0).sort((a,b)=>(+b.unit.tietHoc||0)-(+a.unit.tietHoc||0)).forEach(E=>{
    const lvs=LEVELS.filter(l=>hasYccd(E.unit,l));
    // lượt 0: chỉ lấy trong cùng chủ đề (không đổi điểm chủ đề); lượt 1: lấy từ chủ đề đang dư điểm nhất
    for(const pass of [0,1]) for(const l of lvs) for(const f of state.formats){
      if(f.kind==='dung_sai' || !f.choLevels.includes(l)) continue;
      const donors=flat.filter(d=>d.unit!==E.unit && cntU(d.unit)>1 && (d.unit.levels[l].alloc[f.id]||0)>0 && (pass===1 || d.topic===E.topic))
        .sort((a,b)=> pass===0 ? cntU(b.unit)-cntU(a.unit) : (devT(b.topic)-devT(a.topic)) || (cntU(b.unit)-cntU(a.unit)));
      if(donors.length){ donors[0].unit.levels[l].alloc[f.id]--; E.unit.levels[l].alloc[f.id]=1; return; }
    }
  });
  const thieu=flat.filter(x=>cntU(x.unit)===0).length, bad2=state.topics.some(t=>Math.abs(devT(t))>TOL);
  render();
  const chuY=allUnits().filter(({unit})=>!unit.khongKT && !LEVELS.some(l=>hasYccd(unit,l))).length;
  toast((chuyen||bo||chuY ? `Chỉ phân bổ vào các mục có yêu cầu cần đạt.${chuyen?' '+chuyen+' câu/ý được chuyển sang mục có yêu cầu.':''}${bo?' '+bo+' câu/ý không đặt được vì thiếu yêu cầu cần đạt (đề đang thiếu '+bo+').':''}${chuY?' '+chuY+' bài chưa có yêu cầu cần đạt nên không có câu.':''} ` : '') + (bad2 ? "Đã phân bổ, nhưng có chủ đề lệch hơn 0,25đ so với số tiết. Thầy xem bảng bên dưới và chỉnh tay." : "Đã tự động phân bổ, mọi chủ đề lệch không quá 0,25đ so với số tiết.")
    + (thieu ? ` Còn ${thieu} bài chưa có câu vì đề không đủ số câu để phủ hết các bài.` : ""));
}

/* ---------------- NẠP SGK TỪ FILE .md / .txt ---------------- */
const SGK_CAP = 15000; // số ký tự SGK của mỗi bài được gửi cho AI
function sgkStatus(u){
  const n=(u.sgk||'').trim().length;
  if(!n) return ' ⚠ chưa nhập';
  return ' ✓ ('+n.toLocaleString('vi-VN')+' ký tự'+(n>SGK_EXCERPT_CAP?', AI chỉ nhận các đoạn liên quan nhất với yêu cầu cần đạt':'')+')';
}
function sgkNorm(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')
    .replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function sgkBaiNo(norm){ const m=norm.match(/\bbai (\d+)\b/); return m?+m[1]:null; }
function sgkTitleOnly(norm){ return norm.replace(/^(bai \d+ ?)/,'').trim(); }
// Cắt file thành các mục: mỗi dòng "# Bài N..." hoặc "## Bài N..." mở một mục mới.
// Dòng "# Chương..."/"# Chủ đề..." chỉ để kết thúc mục trước. Các tiêu đề ### trở xuống là nội dung của bài.
function parseSgkFile(text){
  text=(text||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const secs=[]; let cur=null;
  text.split('\n').forEach(line=>{
    const m=line.match(/^#{1,2}\s+(.+?)\s*#*\s*$/);
    if(m){
      const title=m[1].replace(/[*_`]/g,'').trim(), norm=sgkNorm(title);
      if(/^bai \d+\b/.test(norm)){ cur={title, norm, num:sgkBaiNo(norm), lines:[]}; secs.push(cur); return; }
      if(/^(chuong|chu de|phan)\b/.test(norm)){ cur=null; return; }
    }
    if(cur) cur.lines.push(line);
  });
  secs.forEach(s=>{ s.body=s.lines.join('\n').replace(/\n{3,}/g,'\n\n').trim(); delete s.lines; });
  return secs;
}
function matchSgkSection(sec){
  const all=allUnits().map(x=>({unit:x.unit, norm:sgkNorm(x.unit.name)}));
  const sTitle=sgkTitleOnly(sec.norm);
  const byNum = sec.num==null ? [] : all.filter(x=>sgkBaiNo(x.norm)===sec.num);
  const nameOk = x=>{ const u=sgkTitleOnly(x.norm); return u.length>=4 && sTitle.length>=4 && (u===sTitle || u.includes(sTitle) || sTitle.includes(u)); };
  const both = byNum.filter(nameOk);
  if(both.length===1) return both[0].unit;
  if(byNum.length===1) return byNum[0].unit;
  const byName = all.filter(nameOk);
  if(byName.length===1) return byName[0].unit;
  return null;
}
function applySgkText(text){
  const secs=parseSgkFile(text);
  if(!secs.length){ alert('Không tìm thấy mục nào bắt đầu bằng dòng dạng "## Bài 8. Tên bài" trong file này.'); return; }
  const got=new Map(), unmatched=[], empty=[];
  secs.forEach(s=>{
    if(!s.body){ empty.push(s.title); return; }
    const u=matchSgkSection(s);
    if(!u){ unmatched.push(s.title); return; }
    got.set(u, (got.has(u)?got.get(u)+'\n\n':'')+s.body);
  });
  if(!got.size){ alert('Đọc được '+secs.length+' mục bài trong file nhưng không mục nào khớp với tên bài trong đề.\nHãy đặt tên bài trong đề giống tiêu đề trong file (số bài hoặc tên bài).\n\nVí dụ mục trong file: '+secs[0].title); return; }
  let ghiDe=0; got.forEach((v,u)=>{ if((u.sgk||'').trim()) ghiDe++; });
  const thieu=allUnits().filter(({unit})=>!unit.khongKT && !got.has(unit) && !(unit.sgk||'').trim()).map(x=>x.unit.name);
  let msg='Đọc được '+secs.length+' mục bài trong file.\n✔ Khớp và sẽ điền vào '+got.size+' bài trong đề.';
  if(ghiDe) msg+='\n⚠ '+ghiDe+' bài đã có nội dung SGK sẽ bị thay bằng nội dung từ file.';
  if(unmatched.length) msg+='\n✘ Không khớp bài nào trong đề ('+unmatched.length+'): '+unmatched.slice(0,6).join('; ')+(unmatched.length>6?'...':'');
  if(empty.length) msg+='\n✘ Mục trống, bỏ qua ('+empty.length+'): '+empty.slice(0,4).join('; ')+(empty.length>4?'...':'');
  if(thieu.length) msg+='\nBài trong đề vẫn chưa có SGK ('+thieu.length+'): '+thieu.slice(0,6).join('; ')+(thieu.length>6?'...':'');
  msg+='\n\nTiếp tục nạp?';
  if(!confirm(msg)) return;
  got.forEach((v,u)=>{ u.sgk=v; });
  render();
  toast('Đã nạp SGK cho '+got.size+' bài. Nhớ bấm lưu đề nếu muốn giữ lại.');
}
function nhapSGKFile(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.md,.markdown,.txt,text/plain,text/markdown';
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    try{ applySgkText(await f.text()); }catch(e){ alert('Không đọc được file: '+e.message); }
  };
  inp.click();
}

/* ---------------- DÙNG CHUNG: THỨ TỰ HÌNH THỨC, ĐÁNH SỐ CÂU, ĐỊNH DẠNG SỐ ---------------- */
function vnPlain(n){ return String(Math.round(n*100)/100).replace('.',','); }
function vn(n){ const r=Math.round(n*100)/100; return String(r).replace('.',',') + (Number.isInteger(r)?',0':''); }
function pctStr(n){ return String(Math.round(n*10)/10).replace('.',','); }
function orderedFormats(){ return [...state.formats.filter(f=>f.group==='TNKQ'), ...state.formats.filter(f=>f.group!=='TNKQ')]; }
function groupsOf(){
  const o=orderedFormats();
  return [{label:'TNKQ',formats:o.filter(f=>f.group==='TNKQ')},{label:'Tự luận',formats:o.filter(f=>f.group!=='TNKQ')}].filter(g=>g.formats.length);
}
// Danh sách "ô câu hỏi" theo đúng thứ tự trong đề, đánh số liên tục. Câu Đúng–Sai gồm nhiều ý (mỗi ý có bài + mức độ riêng).
function buildSlots(){
  const slots=[], ulc={}; let num=1;
  orderedFormats().forEach(f=>{
    const items=[];
    allUnits().forEach(({topic,unit})=>LEVELS.forEach(l=>{
      const n=unit.levels[l].alloc[f.id]||0;
      for(let k=0;k<n;k++){ const kk=unit.id+'|'+l, c=ulc[kk]||0; ulc[kk]=c+1; items.push({topic,unit,level:l,k,ul:c}); }
    }));
    if(f.kind==='dung_sai'){
      const per=+f.soYMoiCau||1;
      for(let c=0;c*per<items.length;c++) slots.push({key:`${f.id}|ds|${c}`, format:f, num:num++, items:items.slice(c*per,(c+1)*per)});
    } else {
      items.forEach(it=>slots.push({key:`${it.unit.id}|${it.level}|${f.id}|${it.k}`, format:f, num:num++, items:[it]}));
    }
  });
  return slots;
}
function placementMap(){
  const m={};
  buildSlots().forEach(sl=>sl.items.forEach((it,i)=>{
    const k=`${it.unit.id}|${it.level}|${sl.format.id}`;
    (m[k]=m[k]||[]).push({num:sl.num, letter: sl.format.kind==='dung_sai' ? 'abcdefgh'[i] : ''});
  }));
  return m;
}
function cellNote(list, isDS){
  if(!list||!list.length) return '';
  if(!isDS) return list.length+'<br>'+list.map(x=>'C'+x.num).join(',');
  const g=[];
  list.forEach(x=>{ const last=g[g.length-1]; if(last&&last.num===x.num) last.l.push(x.letter); else g.push({num:x.num,l:[x.letter]}); });
  return list.length+' ý<br>'+g.map(x=>'C'+x.num+x.l.join(',')).join(',');
}
function fmtTong(cau,y){ const p=[]; if(cau) p.push(String(cau)); if(y) p.push(y+' ý'); return p.join(', '); }
function totalsByFormat(){
  const tot={};
  orderedFormats().forEach(f=>{ tot[f.id]={NB:0,TH:0,VD:0}; LEVELS.forEach(l=>{ allUnits().forEach(({unit})=>{ tot[f.id][l]+=unit.levels[l].alloc[f.id]||0; }); }); });
  return tot;
}
function soCauThuc(f,tot){ const n=LEVELS.reduce((a,l)=>a+tot[f.id][l],0); return f.kind==='dung_sai' ? Math.ceil(n/(+f.soYMoiCau||1)) : n; }

    const f=inp.files[0]; if(!f) return; const fr=new FileReader();

      im.onload=()=>{ const sc=Math.min(1,640/Math.max(im.width,im.height)), w=Math.max(1,Math.round(im.width*sc)), h=Math.max(1,Math.round(im.height*sc));
        const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);

function escBr(s){ return esc(s).replace(/\r?\n/g,'<br>'); }
/* ================= XUẤT FILE .DOCX THẬT (Office Open XML) ================= */
/* Viết tay ZIP (STORE, không nén) + XML tối giản để Word mở không báo lỗi định dạng,
   thay cho thủ thuật HTML giả .doc trước đây (Word hay báo "định dạng không khớp"). */
function escXml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function crc32(buf){
  if(!crc32.table){
    const t=[];
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++){ c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); }
      t[n]=c>>>0;
    }
    crc32.table=t;
  }
  let crc = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) crc = (crc>>>8) ^ crc32.table[(crc ^ buf[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function makeZipBlob(files){
  const encoder = new TextEncoder();
  const localParts = [], centralParts = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours()<<11)|(now.getMinutes()<<5)|((now.getSeconds()/2)|0)) & 0xFFFF;
  const dosDate = (((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate()) & 0xFFFF;
  files.forEach(f=>{
    const nameBytes = encoder.encode(f.name);
    const data = f.data instanceof Uint8Array ? f.data : encoder.encode(f.data);
    const crc = crc32(data);
    const size = data.length;
    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, dosTime, true); dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
    dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    localParts.push(local, data);
    const central = new Uint8Array(46 + nameBytes.length);

function sgkForSlot(sl, extraQ){
  const by=new Map();
  sl.items.forEach(it=>{ const L=yccdLines(it.unit,it.level), y=L.length?L[it.ul%L.length]:''; const e=by.get(it.unit.id)||{u:it.unit,q:[]}; e.q.push(y); by.set(it.unit.id,e); });
  const cap = by.size>1 ? Math.max(1500, Math.floor(7000/by.size)) : SGK_EXCERPT_CAP;
  let txt='';
  by.forEach(e=>{ const sg=(e.u.sgk||'').trim(); if(!sg) return;
    txt+='\n[Bài "'+e.u.name+'"]\n'+sgkExcerpt(sg, e.u.name+' '+e.q.join(' ')+' '+(extraQ||''), cap)+'\n'; });
  return {txt};
}
function fullSgkOf(sl){ const seen=new Set(); let s=''; sl.items.forEach(it=>{ if(seen.has(it.unit.id)) return; seen.add(it.unit.id); s+='\n'+(it.unit.sgk||''); }); return s.trim(); }

/* --- Kiểm căn cứ AI trích: phải có thật trong SGK đã nạp --- */
const _sgkIdx=new Map();
function sgkIndex(full){
  let r=_sgkIdx.get(full); if(r) return r;
  const n=vnKey(full), w=n.split(' '), g=new Set();
  for(let k=0;k+2<w.length;k++) g.add(w[k]+' '+w[k+1]+' '+w[k+2]);
  r={n:' '+n+' ', g}; if(_sgkIdx.size>20) _sgkIdx.clear(); _sgkIdx.set(full,r); return r;
}
function quoteCover(quote, idx){
  const n=vnKey(quote); if(!n) return 1;
  if(idx.n.includes(' '+n+' ')) return 1;
  const w=n.split(' '); if(w.length<4) return idx.n.includes(n)?1:0;
  let tot=0, hit=0; for(let k=0;k+2<w.length;k++){ tot++; if(idx.g.has(w[k]+' '+w[k+1]+' '+w[k+2])) hit++; }
  return tot?hit/tot:0;
}
function trichIssues(sl,q){
  const out=[]; if(!q||!q.noidung||!sgkOf(sl)||typeof q.trichdan!=='string') return out;
  const t=q.trichdan.trim();
  if(!t){ out.push({sev:'warn',msg:'Thiếu căn cứ SGK (AI chưa trích câu trong sách), cần đối chiếu kỹ'}); return out; }
  const idx=sgkIndex(fullSgkOf(sl));
  const lines=t.split(/\n+/).map(x=>x.replace(/^\s*[a-h]\s*[.)]\s*/i,'').replace(/^["“”'‘’]+|["“”'‘’]+$/g,'').trim()).filter(Boolean);
  const bad=lines.filter(x=>quoteCover(x,idx)<0.7);
  if(bad.length) out.push({sev:'err',msg:'Căn cứ AI trích không có trong SGK đã nạp (nghi bịa hoặc sai sách): "'+bad[0].slice(0,60)+'..."'});
  return out;
}

/* --- Chống trùng câu bằng code (không phụ thuộc AI) --- */
function gramsOf(w,n){ const g=new Set(); for(let k=0;k+n-1<w.length;k++) g.add(w.slice(k,k+n).join(' ')); return g; }
function jac(a,b){ if(!a.size||!b.size) return 0; let i=0; a.forEach(x=>{ if(b.has(x)) i++; }); return i/(a.size+b.size-i); }
const _segMemo=new Map();
function segInfo(s){
  let r=_segMemo.get(s); if(r) return r;
  const w=vnKey(s).split(' ').filter(Boolean);
  r={w, uni:new Set(keyWords(s)), tri:gramsOf(w,3)}; if(_segMemo.size>800) _segMemo.clear(); _segMemo.set(s,r); return r;
}
function segSim(a,b){
  const A=segInfo(a), B=segInfo(b);
  if(A.w.length<3||B.w.length<3) return 0;
  const uni=jac(A.uni,B.uni)*0.85;
  if(A.w.length<6||B.w.length<6) return uni;
  return Math.max(jac(A.tri,B.tri), uni);
}
function qSegs(sl,q){
  const nd=(q&&q.noidung)||'';
  if(sl.format.dang==='nhieu_lua_chon'){ const p=parseMCQ(nd); return [p.stem||nd]; }
  if(sl.format.dang==='dung_sai'){ const p=parseDS(nd); return [p.lead].concat(Object.values(p.items)).filter(Boolean); }
  return [nd];
}
function ansKey(sl,q){
  const da=String((q&&q.dapan)||'').trim();
  if(sl.format.dang==='nhieu_lua_chon'){ const p=parseMCQ(q.noidung||''), L=(da.match(/^[A-D]/)||[''])[0]; return L&&p.opts[L]?vnKey(p.opts[L]):''; }
  if(sl.format.dang==='tra_loi_ngan') return vnKey(da);
  return '';
}
function dupPair(s1,q1,s2,q2){
  let best=0;
  qSegs(s1,q1).forEach(a=>qSegs(s2,q2).forEach(b=>{ const v=segSim(a,b); if(v>best) best=v; }));
  if(best>=0.5) return {sev:'err',why:'giống '+Math.round(best*100)+'%'};
  const a1=ansKey(s1,q1), a2=ansKey(s2,q2);
  if(a1 && a1===a2 && a1.length>=3 && !/^\d+$/.test(a1) && best>=0.3) return {sev:'err',why:'cùng hỏi về một đáp án'};
  if(s1.format.dang==='nhieu_lua_chon' && s2.format.dang==='nhieu_lua_chon'){
    const set2=new Set(Object.values(parseMCQ(q2.noidung).opts).map(vnKey));
    const sh=Object.values(parseMCQ(q1.noidung).opts).map(vnKey).filter(x=>x && set2.has(x)).length;
    if(sh>=3 && best>=0.3) return {sev:'err',why:'trùng '+sh+'/4 phương án'};
  }
  if(q1.trichdan && q2.trichdan){
    const A=segInfo(q1.trichdan), B=segInfo(q2.trichdan);
    if(A.w.length>=8 && B.w.length>=8 && jac(A.tri,B.tri)>=0.8) return {sev:'warn',why:'cùng căn cứ SGK'};
  }
  return null;
}
function dupIssues(sl,q){
  const out=[]; if(!q||!q.noidung) return out;
  buildSlots().forEach(o=>{
    if(o.key===sl.key) return; const q2=state.questions[o.key]; if(!q2||!q2.noidung) return;
    const r=dupPair(sl,q,o,q2); if(!r) return;
    out.push({sev:r.sev, msg:(r.sev==='err'?'Trùng ý với Câu ':'Gần giống Câu ')+o.num+' ('+r.why+')', other:o});
  });
  if(sl.format.dang==='dung_sai'){
    const p=parseDS(q.noidung), ks=Object.keys(p.items);
    for(let a=0;a<ks.length;a++) for(let b=a+1;b<ks.length;b++) if(segSim(p.items[ks[a]],p.items[ks[b]])>=0.5) out.push({sev:'err',msg:'Trùng ý: ý '+ks[a]+') và ý '+ks[b]+') trong cùng câu giống nhau'});
  }
  return out;
}

function parseAiText(text){
  const t=String(text||'').replace(/```[a-z]*|```/gi,'').replace(/\*\*/g,'').trim();
  const ch=t.match(/===CANHOI===([\s\S]*)/); if(ch) return {canhoi:ch[1].trim()};
  const g=k=>{ const m=t.match(new RegExp('==='+k+'===([\\s\\S]*?)(?====[A-Z]+===|$)')); return m?m[1].trim():''; };
  return {noidung:g('NOIDUNG'), dapan:g('DAPAN'), giaithich:g('GIAITHICH'), trichdan:g('TRICHDAN'), hinh:g('HINH')};
}
function postProcess(sl,r){
  const f=sl.format; r.noidung=r.noidung.replace(/\n{3,}/g,'\n\n');
  if(f.dang==='nhieu_lua_chon'){
    const p=parseMCQ(r.noidung);
    if(['A','B','C','D'].every(L=>p.opts[L])){
      const a=(r.dapan.match(/[A-D]/)||[''])[0], tg=targetLetter(sl);
      if(a && a!==tg){ const t=p.opts[a]; p.opts[a]=p.opts[tg]; p.opts[tg]=t; }
      if(a){ r.noidung=canonMCQ(p.stem,p.opts); r.dapan=tg; }
    }
  } else if(f.dang==='dung_sai'){
    const rr=parseDSAns(r.dapan), n=sl.items.length;
    if(Object.keys(rr).length>=n) r.dapan=Array.from({length:n},(_,k)=>{ const L='abcdefgh'[k]; return L+') '+(rr[L]==='Đ'?'Đúng':'Sai'); }).join('; ');
    const p=parseDS(r.noidung);
    if(Object.keys(p.items).length===n) r.noidung=(p.lead?p.lead+'\n':'')+Object.keys(p.items).map(k=>k+') '+p.items[k]).join('\n');
  } else if(f.dang==='tra_loi_ngan'){
    r.dapan=r.dapan.replace(/^(đáp án|kết quả)\s*[:=]\s*/i,'').replace(/[.\s]+$/,'');
    if(kieuOf(f)==='so'){ const m=r.dapan.match(/^([-+]?\d+(?:[.,]\d+)?)\s*([^\d]{1,15})$/); if(m) r.dapan=m[1]; }
    r.dapan=r.dapan.replace(/^["“”'‘’]+|["“”'‘’]+$/g,'').trim();
  }
  return r;
}

async function verifyQuestion(sl,r){

  const its=sl.items.map(it=>{ const L=yccdLines(it.unit,it.level); return '- Bài "'+it.unit.name+'", mức '+LEVEL_LABEL[it.level]+', yêu cầu cần đạt: '+(L.length?L[it.ul%L.length]:'(chưa có)'); }).join('\n');

async function callClaudeForQuestion(prompt,temp,mult){
  const apiKey = getApiKey();
  if(!apiKey) throw new Error("Chưa nhập Gemini API key. Vào Tab 1 → nhập key miễn phí từ aistudio.google.com");
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: (temp==null?0.5:temp), maxOutputTokens: 4096*(mult||1) }
    })
  });
  if(!response.ok){
    const err = await response.json().catch(()=>({}));
    const msg = err?.error?.message || response.statusText;
    if(response.status === 400 || response.status === 403)
      throw new Error("API key không hợp lệ hoặc chưa bật quyền. Kiểm tra lại trong Tab 1. (" + msg + ")");
    if(response.status === 404)
      throw new Error("Model AI không tồn tại/đã ngừng hỗ trợ (404). (" + msg + ")");
    if(response.status === 429){
      const e = new Error("RATE_LIMIT");
      e.isRateLimit = true;
      throw e;
    }
    throw new Error("Lỗi Gemini API (" + response.status + "): " + msg);
  }
  const data = await response.json();
  const cand = data?.candidates?.[0];
  const text = cand?.content?.parts?.[0]?.text || '';
  if(!text){
    const reason = cand?.finishReason || 'không rõ';
    throw new Error("AI không trả về nội dung (finishReason: " + reason + "). Có thể do bộ lọc an toàn — thử đổi lại nội dung/chủ đề.");
  }
  if(cand?.finishReason === 'MAX_TOKENS'){
    const e = new Error("Nội dung bị cắt cụt do vượt giới hạn độ dài (MAX_TOKENS). Đang thử lại...");
    e.isTruncated = true;
    throw e;
  }
  return text;
}

async function callServerOnce(prompt,temp,mult){
  let res;

    res = await fbFn.httpsCallable('soanAI',{timeout:120000})({prompt, temp: (temp==null?0.5:temp), mult: mult||1});
  }catch(e){
    const ma = e && e.details && e.details.ma;
    const err = new Error((e && e.message) || 'Lỗi AI');
    if(ma==='RATE_LIMIT') err.isRateLimit = true;
    if(['HET_LUOT','HET_NGAY','HET_HAN','KHONG_PHAI_GOI_AI','KHONG_CO_QUYEN'].includes(ma)) err.serverStop = ma;
    throw err;
  }
  const d = res.data || {};
  if(typeof d.luotConLai === 'number'){ luotConLai = d.luotConLai; renderQuotaBadge(); }
  if(d.finishReason === 'MAX_TOKENS'){ // máy chủ không trả văn bản khi bị cắt, nên xét trước kiểm tra rỗng
    const e = new Error('Nội dung bị cắt cụt do vượt giới hạn độ dài. Đang thử lại...');
    e.isTruncated = true; throw e;
  }
  if(!d.text) throw new Error('AI không trả về nội dung (finishReason: ' + (d.finishReason||'không rõ') + '). Thử đổi lại nội dung/chủ đề.');
  return d.text;
}
async function callServerWithRetry(prompt,temp,role){
  let mult = 1;
  for(let attempt=0; attempt<4; attempt++){
    const last = attempt === 3;
    try{
      return await callServerOnce(prompt,temp,mult);
    }catch(e){
      if(e.isRateLimit && !last){ await sleep(15000*(attempt+1)); continue; }
      if(e.isTruncated && !last){ mult = Math.min(mult*2,4); continue; }
      if(e.serverStop === 'HET_NGAY') throw new Error('Hôm nay thầy đã dùng hết số lượt AI tối đa trong ngày. Mai dùng tiếp, hoặc nhập key Gemini riêng ở Tab 1 để soạn tiếp ngay.');
      if(e.serverStop === 'HET_LUOT'){ luotConLai = 0; renderQuotaBadge(); return await callWithRetry(prompt,null,temp,role); }
      if(e.serverStop === 'HET_HAN') throw new Error('Tài khoản đã hết hạn sử dụng. Vui lòng liên hệ để gia hạn.');
      if(e.isRateLimit) throw new Error('Máy chủ AI đang quá tải, đợi 1 phút rồi thử lại.');
      throw e;
    }
  }
}
async function callWithRetry(prompt, maxAttempts, temp, role){
  if(useServerAI()) return await callServerWithRetry(prompt,temp,role);
  if(licenseGoi === 'ai' && !getApiKeys().length && !getOpenAIKeys().length)
    throw new Error('Đã hết lượt AI sẵn. Nhập key Gemini miễn phí ở Tab 1 để soạn tiếp, hoặc liên hệ để mua thêm lượt.');
  if(getProvider(role||'soan')==='openai') return await callOpenAIWithRetry(prompt,temp);
  maxAttempts = maxAttempts || (getApiKeys().length + 3);
  const backoffs = [15000, 30000, 45000];
  let mult=1;
  for(let attempt=0; attempt<maxAttempts; attempt++){
    try{
      return await callClaudeForQuestion(prompt,temp,mult);
    }catch(e){
      const isLast = attempt === maxAttempts-1;
      if(e.isRateLimit){
        if(rotateApiKey()){
          toast("⚠ Key hiện tại hết hạn mức — tự chuyển sang key kế tiếp...");
          continue; // thử ngay với key mới, không tính vào số lần chờ
        }
        if(!isLast){
          await sleep(backoffs[attempt]||45000);
          activeKeyIndex = 0; // hết key dự phòng, quay lại key đầu sau khi chờ
          continue;
        }
        throw new Error("Đã vượt giới hạn miễn phí của Gemini (429) trên tất cả các key. Vui lòng đợi 1 phút hoặc thêm key mới rồi thử lại.");
      }
      if(e.isTruncated && !isLast){
        mult=Math.min(mult*2,4); await sleep(500);
        continue;
      }
      throw e;
    }
  }
}
