  add(Math.abs(tl-100)<0.01?'ok':'err','Cấu hình','Tổng tỉ lệ mức độ mục tiêu là '+tl+'%'+(Math.abs(tl-100)<0.01?'':' (phải bằng 100%)'));
  [['truong','trường'],['gv','họ tên giáo viên'],['ngay','ngày kiểm tra'],['namHoc','năm học']].forEach(([k,n])=>{ if(!String(i[k]||'').trim()) add('warn','Cấu hình','Chưa nhập '+n+' (file Word sẽ để trống phần này)'); });
  state.formats.forEach(f=>{ if(f.kind==='dung_sai'){ const b=dsBangOf(f), dc=diemMoiCauThuc(f); if(Math.abs(b[b.length-1]-dc)>0.001) add('err','Cấu hình','Bảng chấm Đúng–Sai: đúng đủ các ý phải bằng '+vn(dc)+' điểm'); } });
  state.topics.forEach(t=>{ if(!t.units.length) add('err','Phân bổ','Chủ đề "'+t.name+'" chưa có bài nào'); });
  let okAlloc=true;
  state.formats.forEach(f=>{ const da=sumAllocForFormat(f.id), mt=soDonVi(f); if(da!==mt){ okAlloc=false; add('err','Phân bổ',f.name+': đã phân bổ '+da+(f.kind==='dung_sai'?' ý':' câu')+', cần '+mt); } });
  if(okAlloc) add('ok','Phân bổ','Số câu (số ý) của từng hình thức khớp với phần thiết lập');
  const names={NB:'Biết',TH:'Hiểu',VD:'Vận dụng'}, tg={NB:+i.tyLeNB,TH:+i.tyLeTH,VD:+i.tyLeVD}; let okLv=true;
  LEVELS.forEach(l=>{ const pc=total?sumDiemForLevel(l)/total*100:0; if(Math.abs(pc-tg[l])>2){ okLv=false; add('warn','Phân bổ','Mức '+names[l]+' đạt '+pctStr(pc)+'%, mục tiêu '+tg[l]+'%'); } });
  if(okLv) add('ok','Phân bổ','Tỉ lệ Biết / Hiểu / Vận dụng đạt đúng mục tiêu');
  allUnits().forEach(({unit})=>LEVELS.forEach(l=>{
    if(state.formats.some(f=>(unit.levels[l].alloc[f.id]||0)>0) && !hasYccd(unit,l)) add('err','Phân bổ','Bài "'+unit.name+'", mức '+names[l]+': có câu hỏi nhưng chưa nhập yêu cầu cần đạt (phải nhập trước rồi mới soạn câu hỏi)');
    state.formats.forEach(f=>{ if((unit.levels[l].alloc[f.id]||0)>0 && !f.choLevels.includes(l)) add('err','Phân bổ','Bài "'+unit.name+'": '+f.name+' không áp dụng cho mức '+names[l]); });
  }));
  slots.filter(x=>x.format.kind==='dung_sai').forEach(x=>{
    const per=+x.format.soYMoiCau||1;
    if(x.items.length<per) add('err','Phân bổ','Câu '+x.num+' (Đúng–Sai) chỉ có '+x.items.length+'/'+per+' ý');
    if(new Set(x.items.map(y=>y.topic.id)).size>1) add('warn','Phân bổ','Câu '+x.num+' (Đúng–Sai) gồm ý của nhiều chủ đề, khó viết một tình huống dẫn chung');
  });
  const empty=[]; let qErr=0;
  slots.forEach(x=>{
    const q=state.questions[x.key];
    if(!q||!q.noidung){ empty.push(x.num); if(q&&q.canhoi){ add('err','Câu hỏi','Câu '+x.num+': AI hỏi lại — '+q.canhoi); qErr++; } return; }
    validateQ(x,q).forEach(v=>{ add(v.sev,'Câu hỏi','Câu '+x.num+': '+v.msg); if(v.sev==='err') qErr++; });
    if(x.format.kind==='dung_sai' && q.sig && q.sig!==slotSig(x)) add('warn','Câu hỏi','Câu '+x.num+': phân bổ ý đã đổi sau khi soạn, nên soạn lại');
    if(q.ysig!==undefined && !missingYccd(x).length && q.ysig!==yccdSigOf(x)) add('warn','Câu hỏi','Câu '+x.num+': yêu cầu cần đạt đã đổi sau khi soạn, nên soạn lại');
    if(q.hinhMoTa && !q.hinh) add('warn','Câu hỏi','Câu '+x.num+': cần chèn hình ('+q.hinhMoTa+')');
    if(Array.from(q.noidung.matchAll(/(^|[^\p{L}\p{N}])((?:(?:Na|Ca|Cl|Fe|Mg|Cu|Zn|Al|H|C|O|N|S|K|P)\d*)+)(?![\p{L}\p{N}])/gu)).some(m=>/\d/.test(m[2]))) add('warn','Câu hỏi','Câu '+x.num+': công thức nên dùng chỉ số dưới (H₂O, CO₂)');
  });
  if(empty.length){ add('err','Câu hỏi',empty.length+' câu chưa có nội dung: Câu '+empty.join(', ')); qErr+=empty.length; }
  if(slots.length && !qErr) add('ok','Câu hỏi','Cả '+slots.length+' câu đều có nội dung và đáp án hợp lệ');
  const cnt={A:0,B:0,C:0,D:0}; let nm=0;
  slots.filter(x=>x.format.dang==='nhieu_lua_chon').forEach(x=>{ const a=((state.questions[x.key]||{}).dapan||'').trim(); if(cnt[a]!==undefined){ cnt[a]++; nm++; } });
  if(nm>=4){ const v=Object.values(cnt); if(Math.max(...v)-Math.min(...v)>2) add('warn','Câu hỏi','Đáp án trắc nghiệm phân bố lệch: A='+cnt.A+', B='+cnt.B+', C='+cnt.C+', D='+cnt.D); else add('ok','Câu hỏi','Đáp án trắc nghiệm phân bố đều: A='+cnt.A+', B='+cnt.B+', C='+cnt.C+', D='+cnt.D); }
  const sum=slots.reduce((a,x)=>a+slotDiem(x),0);
  add(Math.abs(sum-total)<0.01?'ok':'err','Đề và ma trận','Tổng điểm các câu trong đề là '+vn(sum)+', ma trận là '+vn(total));
  return R;
}
function viewCheck(){
  const R=runChecks(), e=R.filter(x=>x.sev==='err').length, w=R.filter(x=>x.sev==='warn').length;
  const ic={err:'✖',warn:'⚠',ok:'✔'}, col={err:'var(--bad,#ff6b6b)',warn:'var(--accent2,#f5c542)',ok:'var(--good,#4cd08a)'};
  let h=`<div class="card"><h2>Kiểm tra tổng thể trước khi xuất</h2><p style="margin-top:6px;"><span class="pill ${e?'bad':'ok'}">${e} lỗi cần sửa</span> <span class="pill">${w} mục nên xem lại</span></p>
  <p class="muted" style="margin-top:8px;">${e?'Sửa hết các lỗi ✖ rồi hãy xuất file Word.':'Không còn lỗi. Thầy xem lại các mục ⚠ (nếu có) rồi xuất file Word.'}</p></div>`;
  ['Cấu hình','Phân bổ','Câu hỏi','Đề và ma trận'].forEach(g=>{
    const L=R.filter(x=>x.g===g); if(!L.length) return;
    h+=`<div class="card"><h2>${g}</h2>`+L.sort((a,b)=>({err:0,warn:1,ok:2}[a.sev]-{err:0,warn:1,ok:2}[b.sev])).map(x=>`<p style="margin:5px 0;"><span style="color:${col[x.sev]};font-weight:700;">${ic[x.sev]}</span> ${esc(x.t)}</p>`).join('')+`</div>`;
  });
  return h;
}

/* ---------------- TAB 6: ĐÁP ÁN ---------------- */
function viewAnswer(){
  let html=`<div class="card"><h2>ĐÁP ÁN & HƯỚNG DẪN CHẤM — ${esc(state.info.ten).toUpperCase()}</h2>
  <div class="flex no-print" style="margin-top:8px;"><button class="primary" onclick="aiGenAll(true)">🤖 AI soạn các câu còn trống</button><button onclick="aiGenAll(false)">🤖 AI soạn lại toàn bộ</button><button class="primary" onclick="exportAnswerWord()">📄 Xuất Word (Đáp án)</button></div></div>`;
  const slots=buildSlots();
  orderedFormats().forEach(f=>{
    html+=`<div class="card"><h2>${esc(f.name)}</h2>`;
    const hint={nhieu_lua_chon:'Một chữ: A, B, C hoặc D',dung_sai:'a) Đúng; b) Sai; c) Đúng; d) Sai',tra_loi_ngan:({so:'Một con số',chu:'Một từ hoặc cụm từ ngắn',ca_hai:'Một con số hoặc một từ/cụm từ ngắn'})[kieuOf(f)],tu_luan:'Mỗi ý một dòng, điểm cuối dòng: Công thức v = s/t (0,5đ)'}[f.dang]||'Đáp án';
    slots.filter(sl=>sl.format.id===f.id).forEach(sl=>{
      const q=state.questions[sl.key]||{};
      html+=`<div class="qslot"><div class="meta flex between"><span>${esc(slotLabel(sl))}${f.kind==='dung_sai'?'':' · '+vn(slotDiem(sl))+' điểm'}</span><span class="no-print">${q.prev?`<button class="small" onclick="restorePrev('${sl.key}')" title="Đổi qua lại giữa câu hiện tại và câu trước đó">↩ Lấy lại câu cũ</button> `:''}<button class="small" onclick="aiGenOne('${sl.key}')">${q.noidung?'🔄 Soạn câu khác':'🤖 Soạn'}</button></span></div>
      <label>Đáp án</label><textarea rows="${f.dang==='tu_luan'?5:2}" placeholder="${hint}" oninput="setQuestion('${sl.key}','dapan',this.value)" onchange="render()">${esc(q.dapan||'')}</textarea>
      ${f.dang==='tu_luan'?'':`<label style="margin-top:6px;">Giải thích (một câu ngắn)</label><textarea rows="2" oninput="setQuestion('${sl.key}','giaithich',this.value)">${esc(q.giaithich||'')}</textarea>`}${issuePills(sl,q)}</div>`;
    });
    html+=`</div>`;
  });
  return html;
}

/* ---------------- UTIL ---------------- */
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
